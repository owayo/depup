name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 検査の中身は Makefile の ci が定義する (fmt-check / clippy / cargo test)。
  # ここには OS 固有の準備だけを置き、検査コマンドを重ねて書かない
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # make ci を回す OS。Windows には入れない: ランナーの make は MinGW の mingw32-make の写しで、
        # レシピの POSIX シェル前提 ($$(...)、[ -n ... ] など) の解釈に癖がある。Windows のテストは build で回す
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ツールの版は mise.toml が正。mise 本体は公開から 14 日以上たった最新の版を、署名付きの checksum で
      # 確かめて入れる。cache は切る。mise-action のキャッシュは mise の導入済みの印だけを戻し、rustup が持つ
      # ツールチェーンと components (clippy / rustfmt) を戻さないため、復元した回だけ
      # 'cargo-clippy' is not installed で落ちる (jdx/mise-action#215)
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      # target/ と ~/.cargo のキャッシュ (鍵に rustc の版が入るので、mise.toml の rust を上げると作り直す)
      - uses: Swatinem/rust-cache@v2

      - name: Show toolchain
        run: mise ls --current

      - run: make setup
      - run: make ci

  # release.yml の build と同じ組 (os / target) でビルドする。release.yml の dry_run では build が
  # 走らないので、配布物を作れることはここで確かめる。Windows はここでテストも回す
  build:
    name: Build (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # release.yml の build と同じ組 (行を足したら両方に足す)。Linux ARM64 は arm64 のランナーで
        # そのままビルドする (cross を使わない)
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # Windows のランナーは既定で LF を CRLF に変えて checkout する。release.yml の build と同じく LF のまま取り、
      # CI で確かめたファイルと配布物のビルドに使うファイルの改行を一致させる
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ビルドに効く環境変数 (MACOSX_DEPLOYMENT_TARGET など) は mise.toml の [env] に置く。mise-action が
      # 後続のステップへ渡すので、ci.yml と release.yml と手元の make で同じ値になる
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # mise.toml の rust はホストのツールチェーンと components だけを入れるので、配布のターゲットを足す
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      # Windows は quality で make ci を回さないので、配る OS の裏付けとしてここでテストする
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
