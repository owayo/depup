[package]
name = "depup"
version = "26.7.100"
edition = "2024"
authors = ["owayo <yoheiowa@gmail.com>"]
description = "Multi-language dependency updater CLI tool"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json"] }
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
semver = "1.0.28"
thiserror = "2.0.18"
anyhow = "1.0.103"
regex = "1.12.4"
async-trait = "0.1.89"
indicatif = "0.18.4"
colored = "3.1.1"
futures = "0.3.32"
dirs = "6.0.0"
which = "8.0.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
