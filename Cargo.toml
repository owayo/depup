[package]
name = "depup"
version = "26.2.105"
edition = "2021"
authors = ["owayo <yoheiowa@gmail.com>"]
description = "Multi-language dependency updater CLI tool"
license = "MIT"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
toml = "1.0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.43", features = ["serde"] }
semver = "1.0.27"
thiserror = "2.0.18"
anyhow = "1.0.101"
regex = "1.12.3"
async-trait = "0.1.89"
indicatif = "0.18.4"
colored = "3.1.1"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.25.0"
