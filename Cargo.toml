[package]
name = "depup"
version = "26.4.100"
edition = "2024"
authors = ["owayo <yoheiowa@gmail.com>"]
description = "Multi-language dependency updater CLI tool"
license = "MIT"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
tokio = { version = "1.51.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
semver = "1.0.28"
thiserror = "2.0.18"
anyhow = "1.0.102"
regex = "1.12.3"
async-trait = "0.1.89"
indicatif = "0.18.4"
colored = "3.1.1"

[dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"
tempfile = "3.27.0"
