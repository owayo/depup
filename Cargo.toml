[package]
name = "depup"
version = "26.7.102"
edition = "2024"
authors = ["owayo <yoheiowa@gmail.com>"]
description = "Multi-language dependency updater CLI tool"
license = "MIT"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
tokio = { version = "1.53.0", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json"] }
toml = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
semver = "1.0.28"
pep440_rs = "0.7.3"
thiserror = "2.0.19"
anyhow = "1.0.104"
regex = "1.13.1"
async-trait = "0.1.91"
indicatif = "0.18.6"
colored = "3.1.1"
futures = "0.3.33"
dirs = "6.0.0"
which = "8.0.5"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
