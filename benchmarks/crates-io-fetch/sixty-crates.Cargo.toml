# crates.io の版の一覧の取得を測る合成マニフェスト。measure.sh が一時ディレクトリへ
# Cargo.toml として写して使う (このファイル名のままでは depup も cargo も読まない)。
# よく使われる crate 60 件を、更新候補が見つかる古い版の指定で並べている。
[package]
name = "crates-io-fetch-fixture"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "0.7"
anyhow = "1.0"
async-trait = "0.1.0"
base64 = "0.13"
bitflags = "1.0"
bytes = "1.0"
cc = "1.0"
chrono = "0.4.0"
clap = "3.0"
colored = "2.0"
crossbeam-channel = "0.5.0"
csv = "1.0"
dirs = "4.0"
env_logger = "0.9"
flate2 = "1.0"
futures = "0.3.0"
glob = "0.3.0"
hashbrown = "0.12"
hex = "0.4.0"
http = "0.2"
humantime = "2.0"
hyper = "0.14"
indexmap = "1.0"
indicatif = "0.16"
itertools = "0.10"
lazy_static = "1.0"
libc = "0.2.0"
log = "0.4.0"
memchr = "2.0"
mime = "0.3.0"
num-traits = "0.2.0"
once_cell = "1.0"
parking_lot = "0.11"
percent-encoding = "2.0"
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.7"
rayon = "1.0"
regex = "1.0"
reqwest = "0.11"
semver = "1.0"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.9"
smallvec = "1.0"
syn = "1.0"
tar = "0.4.0"
tempfile = "3.0"
thiserror = "1.0"
time = "0.3.0"
tokio = "1.0"
toml = "0.5"
tracing = "0.1.0"
tracing-subscriber = "0.3.0"
unicode-width = "0.1.0"
url = "2.0"
uuid = "1.0"
walkdir = "2.0"
which = "4.0"
zip = "0.6"
