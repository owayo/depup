# Toolchain for this repository. Local development (via the Makefile) and CI both
# treat this file as the source of truth for tool versions.

[tools]
# List the components explicitly. Otherwise what gets installed depends on rustup's
# default profile, and the minimal profile on GitHub Actions runners has no
# rustfmt / clippy, so `make ci` fails there.
rust = { version = "1.98.1", components = ["rustfmt", "clippy"] }
