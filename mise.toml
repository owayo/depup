# Toolchain for this repository. Local development (via the Makefile) and CI both
# treat this file as the source of truth for tool versions.

[tools]
# Name the profile and the components explicitly. Otherwise what gets installed depends
# on rustup's default profile, and the minimal profile on GitHub Actions runners has no
# rustfmt / clippy, so `make ci` fails there. With the minimal profile plus the two
# components, local machines and CI install the same set (and skip rust-docs).
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"] }
